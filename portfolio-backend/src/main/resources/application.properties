# Server
server.port=${PORT:8080}

# Database (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email (Resend API)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Portfolio config
portfolio.contact.to-email=${PORTFOLIO_CONTACT_TO_EMAIL:gopichandmogaparthi@gmail.com}
portfolio.allowed-origins=${PORTFOLIO_ALLOWED_ORIGINS:https://gopichandmogaparthi.github.io,http://localhost:3000}
